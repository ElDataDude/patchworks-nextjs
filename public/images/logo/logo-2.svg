<svg fill="none" height="27" viewBox="0 0 180 27" width="180" xmlns="http://www.w3.org/2000/svg">
  <!-- Patchworks text in dark for light mode -->
  <text x="35" y="20" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#090e34">patchworks</text>
  <text x="140" y="20" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#d16013">AI</text>
  
  <!-- Orange patchwork icon -->
  <g fill="#d16013">
    <!-- Main patchwork pattern -->
    <rect x="0" y="0" width="8" height="8" rx="1"/>
    <rect x="10" y="0" width="8" height="8" rx="1"/>
    <rect x="20" y="0" width="8" height="8" rx="1"/>
    <rect x="0" y="10" width="8" height="8" rx="1"/>
    <rect x="10" y="10" width="8" height="8" rx="1"/>
    <rect x="20" y="10" width="8" height="8" rx="1"/>
    <rect x="5" y="19" width="8" height="8" rx="1"/>
    <rect x="15" y="19" width="8" height="8" rx="1"/>
  </g>
  
  <!-- Accent pieces in lighter orange -->
  <g fill="#f59e0b" opacity="0.7">
    <rect x="2" y="2" width="4" height="4" rx="0.5"/>
    <rect x="12" y="12" width="4" height="4" rx="0.5"/>
    <rect x="22" y="2" width="4" height="4" rx="0.5"/>
